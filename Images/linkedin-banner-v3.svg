<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">

  <!-- Background -->
  <rect width="1584" height="396" fill="#0f172a"/>

  <!-- Subtle decorative rectangles top-right -->
  <rect x="1100" y="-120" width="600" height="420" fill="#0f766e" opacity="0.07" transform="rotate(14 1400 90)"/>
  <rect x="1220" y="-40" width="480" height="360" fill="#000998" opacity="0.12" transform="rotate(14 1460 140)"/>

  <!-- Left accent bar -->
  <rect x="80" y="42" width="4" height="280" fill="#0f766e"/>

  <!-- Eyebrow -->
  <text x="98" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#0f766e">HIGH BEAM DIGITAL</text>

  <!-- Name -->
  <text x="80" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#f8fafc">Henry Bell</text>

  <!-- Title -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#94a3b8">Fractional Content Lead · B2B Fintech &amp; Financial Services</text>

  <!-- Tagline -->
  <text x="80" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#334155">highbeamdigital.co.uk</text>

  <!-- Short teal rule -->
  <rect x="80" y="258" width="56" height="1.5" fill="#0f766e" opacity="0.5"/>

  <!-- HBD logo mark (bottom left) -->
  <image href="Logo/White/HBD-White.svg" x="80" y="290" width="130" height="52" preserveAspectRatio="xMinYMid meet"/>

  <!-- Vertical separator -->
  <rect x="820" y="42" width="0.5" height="300" fill="#0f766e" opacity="0.18"/>

  <!-- TRUSTED BY label -->
  <text x="862" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#334155">TRUSTED BY</text>

  <!-- ─── Logo grid: 2 rows × 3 cols ─── -->
  <!-- Col x anchors: 862, 1066, 1270 — each slot 190px wide, logo 170px wide -->
  <!-- Row 1: y=82–168 (86px tall container) -->
  <!-- Row 2: y=200–286 -->

  <!-- R1C1 — iwoca -->
  <image href="Client%20logos/Iwoca_Logo_Wiki.svg.png"
    x="862" y="95" width="170" height="62"
    preserveAspectRatio="xMidYMid meet"
    opacity="0.75" style="filter: brightness(0) invert(1);"/>

  <!-- R1C2 — YouLend -->
  <image href="Client%20logos/YouLend.svg"
    x="1066" y="95" width="170" height="62"
    preserveAspectRatio="xMidYMid meet"
    opacity="0.75" style="filter: brightness(0) invert(1);"/>

  <!-- R1C3 — SAP Fioneer -->
  <image href="Client%20logos/Fioneer%20Logo_Black%20and%20Gold_LowRes_Web_Negative.png"
    x="1270" y="95" width="170" height="62"
    preserveAspectRatio="xMidYMid meet"
    opacity="0.75" style="filter: brightness(0) invert(1);"/>

  <!-- Row divider -->
  <rect x="862" y="186" width="578" height="0.5" fill="#1e293b"/>

  <!-- R2C1 — Nium -->
  <image href="Client%20logos/nium-logo.png"
    x="862" y="206" width="170" height="62"
    preserveAspectRatio="xMidYMid meet"
    opacity="0.75" style="filter: brightness(0) invert(1);"/>

  <!-- R2C2 — Dext -->
  <image href="Client%20logos/dext-logo-rgb-orange.webp"
    x="1066" y="206" width="170" height="62"
    preserveAspectRatio="xMidYMid meet"
    opacity="0.75" style="filter: brightness(0) invert(1);"/>

  <!-- R2C3 — MSCI -->
  <image href="Client%20logos/MSCI_logo_2019.svg"
    x="1270" y="206" width="170" height="62"
    preserveAspectRatio="xMidYMid meet"
    opacity="0.75" style="filter: brightness(0) invert(1);"/>

  <!-- Also worked with row -->
  <text x="862" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#1e293b">Also: Zencargo · Calastone · MSCI · Payconiq · Finshape · Haines Watts</text>

  <!-- Bottom colour bar -->
  <rect x="0" y="386" width="1056" height="10" fill="#0f766e"/>
  <rect x="1056" y="386" width="528" height="10" fill="#000998"/>

</svg>
