<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Fade gradient: dark panel bleeds into photo -->
    <linearGradient id="photoFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <!-- Clip photo to right portion -->
    <clipPath id="photoClip">
      <rect x="840" y="0" width="1080" height="1080"/>
    </clipPath>
  </defs>

  <!-- Full dark background -->
  <rect width="1920" height="1080" fill="#0f172a"/>

  <!-- Portrait photo (right half) -->
  <image href="../Henry%20Bell-12%20(1).jpg" x="820" y="0" width="1100" height="1080"
    preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>

  <!-- Gradient overlay blending photo into dark bg -->
  <rect x="820" y="0" width="600" height="1080" fill="url(#photoFade)"/>

  <!-- Bottom darkening on photo so footer text is legible -->
  <rect x="820" y="820" width="1100" height="260" fill="#0f172a" opacity="0.5"/>

  <!-- HBD Logo top-left -->
  <image href="../Logo/White/HBD-White.svg" x="100" y="56" width="210" height="68" preserveAspectRatio="xMinYMid meet"/>

  <!-- Left accent bar -->
  <rect x="100" y="260" width="5" height="170" fill="#0f766e"/>

  <!-- Eyebrow -->
  <text x="124" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="4.5" fill="#0f766e">FRACTIONAL CONTENT LEAD  ·  B2B FINTECH</text>

  <!-- Name -->
  <text x="100" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="118" fill="#f8fafc">Henry Bell</text>

  <!-- Role line -->
  <text x="102" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="30" fill="#64748b">Copy · Strategy · Content Leadership</text>

  <!-- Divider -->
  <rect x="100" y="568" width="90" height="1.5" fill="#0f766e" opacity="0.5"/>

  <!-- Website -->
  <text x="100" y="614" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#334155" letter-spacing="0.5">highbeamdigital.co.uk</text>

  <!-- Footer -->
  <text x="100" y="1052" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1e293b">highbeamdigital.co.uk</text>
  <text x="1820" y="1052" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="end">01 / 07</text>

  <!-- Bottom colour bar -->
  <rect x="0" y="1068" width="1280" height="12" fill="#0f766e"/>
  <rect x="1280" y="1068" width="640" height="12" fill="#000998"/>
</svg>
