<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0f172a"/>

  <!-- Eyebrow -->
  <text x="120" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="4.5" fill="#0f766e">HOW I WORK</text>
  <rect x="120" y="126" width="70" height="1.5" fill="#0f766e" opacity="0.4"/>

  <!-- Headline -->
  <text x="120" y="202" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#f8fafc">Flexible to your needs — embedded or project-based.</text>

  <!-- Three engagement type cards -->
  <!-- Card 1: Fractional (x=120, w=500) -->
  <rect x="120" y="248" width="500" height="340" rx="3" fill="#1e293b"/>
  <rect x="120" y="248" width="5" height="340" rx="0" fill="#0f766e"/>
  <text x="152" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#0f766e">FRACTIONAL CONTENT LEAD</text>
  <text x="152" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#f8fafc">2–4 days/week</text>
  <text x="152" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Embedded in your team</text>
  <text x="152" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Own strategy and execution</text>
  <text x="152" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Attend stand-ups, manage writers</text>
  <text x="152" y="506" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Align with product, comms &amp; sales</text>
  <text x="152" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#0f766e">Flexible on rate for long-term engagement</text>

  <!-- Card 2: Project-based (x=660, w=500) -->
  <rect x="660" y="248" width="500" height="340" rx="3" fill="#1e293b"/>
  <rect x="660" y="248" width="5" height="340" rx="0" fill="#0f766e"/>
  <text x="692" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#0f766e">PROJECT-BASED</text>
  <text x="692" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#f8fafc">Defined scope</text>
  <text x="692" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Website rewrites &amp; launches</text>
  <text x="692" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Go-to-market campaigns</text>
  <text x="692" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Whitepapers &amp; reports</text>
  <text x="692" y="506" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Sales decks &amp; collateral</text>
  <text x="692" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#0f766e">Day rate: £500</text>

  <!-- Card 3: Ongoing retainer (x=1200, w=600) -->
  <rect x="1200" y="248" width="600" height="340" rx="3" fill="#1e293b"/>
  <rect x="1200" y="248" width="5" height="340" rx="0" fill="#0f766e"/>
  <text x="1232" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#0f766e">ONGOING RETAINER</text>
  <text x="1232" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#f8fafc">Predictable output</text>
  <text x="1232" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">SEO content programmes</text>
  <text x="1232" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Thought leadership &amp; ghostwriting</text>
  <text x="1232" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Newsletters &amp; editorial calendars</text>
  <text x="1232" y="506" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Ongoing messaging &amp; brand voice</text>
  <text x="1232" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#0f766e">Flexible structure for long-term work</text>

  <!-- Details row -->
  <rect x="120" y="632" width="1680" height="1" fill="#1e293b"/>

  <text x="120" y="684" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#475569">AVAILABILITY</text>
  <text x="120" y="716" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">Remote (Bristol, UK) · Available across UK &amp; European time zones</text>

  <rect x="120" y="750" width="1680" height="1" fill="#1e293b"/>

  <text x="120" y="802" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#475569">LANGUAGES</text>
  <text x="120" y="834" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">English (native) · French (fluent) · Italian &amp; Spanish (advanced)</text>

  <!-- Contact CTA -->
  <rect x="120" y="900" width="400" height="68" fill="#0f766e"/>
  <text x="320" y="942" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">henry@highbeamdigital.co.uk</text>

  <!-- Footer -->
  <text x="120" y="1050" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e293b">highbeamdigital.co.uk</text>
  <text x="1800" y="1050" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="end">07 / 07</text>

  <!-- Bottom colour bar -->
  <rect x="0" y="1070" width="1280" height="10" fill="#0f766e"/>
  <rect x="1280" y="1070" width="640" height="10" fill="#000998"/>
</svg>
