  <text x="1214" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#0f766e">Flexible structure for retained work</text>

  <!-- Details section -->
  <rect x="100" y="650" width="1720" height="1" fill="#1e293b"/>

  <!-- Detail row: Availability -->
  <text x="100" y="706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#334155">AVAILABILITY</text>
  <text x="340" y="706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#64748b">Remote (Bristol, UK)  ·  Available across UK &amp; European time zones</text>

  <rect x="100" y="738" width="1720" height="1" fill="#1e293b"/>

  <!-- Detail row: Languages -->
  <text x="100" y="792" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#334155">LANGUAGES</text>
  <text x="340" y="792" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#64748b">English (native)  ·  French (fluent)  ·  Italian &amp; Spanish (advanced)</text>

  <rect x="100" y="824" width="1720" height="1" fill="#1e293b"/>

  <!-- CTA button -->
  <rect x="100" y="880" width="480" height="66" fill="#0f766e"/>
  <text x="340" y="921" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">henry@highbeamdigital.co.uk</text>

  <!-- Website alongside -->
  <text x="614" y="921" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#334155">highbeamdigital.co.uk</text>

  <!-- Footer -->
  <text x="100" y="1052" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1e293b">highbeamdigital.co.uk</text>
  <text x="1820" y="1052" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#1e293b" text-anchor="end">07 / 07</text>

  <!-- Bottom colour bar -->
  <rect x="0" y="1068" width="1280" height="12" fill="#0f766e"/>
  <rect x="1280" y="1068" width="640" height="12" fill="#000998"/>
</svg>
