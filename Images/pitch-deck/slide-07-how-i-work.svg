<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- DARK SLIDE -->
  <rect width="1920" height="1080" fill="#0f172a"/>

  <!-- Eyebrow -->
  <text x="100" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="4.5" fill="#0f766e">HOW I WORK</text>
  <rect x="100" y="124" width="60" height="1.5" fill="#0f766e" opacity="0.4"/>

