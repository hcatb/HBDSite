  <text x="100" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#f8fafc">Flexible to your needs — embedded or project-based.</text>

  <!-- ===== THREE ENGAGEMENT CARDS ===== -->
  <!-- Canvas: 1920-200=1720. 3 cards = ~550px each with gaps -->
  <!-- Card 1: x=100, w=510 -->
  <rect x="100" y="244" width="510" height="360" rx="3" fill="#1e293b"/>
  <rect x="100" y="244" width="5" height="360" fill="#0f766e"/>
  <text x="134" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#0f766e">FRACTIONAL CONTENT LEAD</text>
  <text x="134" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#f8fafc">2–4 days/week</text>
  <text x="134" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Embedded in your team</text>
  <text x="134" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Own strategy and execution</text>
  <text x="134" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Stand-ups, briefs, writer oversight</text>
  <text x="134" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Aligns with product, comms &amp; sales</text>
  <text x="134" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#0f766e">Flexible on rate for long-term work</text>

  <!-- Card 2: x=640, w=510 -->
  <rect x="640" y="244" width="510" height="360" rx="3" fill="#1e293b"/>
  <rect x="640" y="244" width="5" height="360" fill="#0f766e"/>
  <text x="674" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#0f766e">PROJECT-BASED</text>
  <text x="674" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#f8fafc">Defined scope</text>
  <text x="674" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Website rewrites &amp; launches</text>
  <text x="674" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Go-to-market campaigns</text>
  <text x="674" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Whitepapers &amp; reports</text>
  <text x="674" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Sales decks &amp; collateral</text>
  <text x="674" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#0f766e">Day rate: £500</text>

  <!-- Card 3: x=1180, w=640 -->
  <rect x="1180" y="244" width="640" height="360" rx="3" fill="#1e293b"/>
  <rect x="1180" y="244" width="5" height="360" fill="#0f766e"/>
  <text x="1214" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#0f766e">ONGOING RETAINER</text>
  <text x="1214" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#f8fafc">Predictable output</text>
  <text x="1214" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">SEO content programmes</text>
  <text x="1214" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Thought leadership &amp; ghostwriting</text>
  <text x="1214" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Newsletters &amp; editorial calendars</text>
