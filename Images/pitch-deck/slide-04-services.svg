<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#0f172a"/>

  <!-- Subtle decorative rectangle -->
  <rect x="850" y="600" width="320" height="500" fill="#0f766e" opacity="0.06" transform="rotate(-10 1010 850)"/>

  <!-- Eyebrow -->
  <text x="72" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#0f766e">WHAT I OFFER</text>
  <rect x="72" y="162" width="60" height="1.5" fill="#0f766e" opacity="0.3"/>

  <!-- Headline -->
  <text x="72" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#f8fafc">Three ways I can help</text>
  <text x="72" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#f8fafc">your fintech grow.</text>

  <!-- Divider full -->
  <rect x="72" y="340" width="936" height="1" fill="#1e293b"/>

  <!-- Service 01 -->
  <text x="72" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#0f766e">01  FOUNDATION &amp; PIVOT</text>
  <text x="72" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Messaging architecture, value propositions,</text>
  <text x="72" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">web copy &amp; brand voice guidelines</text>

  <rect x="72" y="492" width="936" height="1" fill="#1e293b"/>

  <!-- Service 02 -->
  <text x="72" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#0f766e">02  GROWTH &amp; SCALE</text>
  <text x="72" y="582" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Thought leadership, whitepapers, SEO,</text>
  <text x="72" y="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">ghostwriting &amp; original research</text>

  <rect x="72" y="640" width="936" height="1" fill="#1e293b"/>

  <!-- Service 03 -->
  <text x="72" y="696" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#0f766e">03  SALES ENABLEMENT</text>
  <text x="72" y="730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">Pitch decks, battlecards, go-to-market messaging</text>
  <text x="72" y="758" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#64748b">&amp; product feature copy</text>

  <rect x="72" y="788" width="936" height="1" fill="#1e293b"/>

  <!-- Also available block -->
  <text x="72" y="848" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#475569">Also available as a Fractional Content Lead — embedded in your team,</text>
  <text x="72" y="876" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#475569">owning strategy and execution end-to-end.</text>

  <!-- Footer -->
  <text x="72" y="1053" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#334155" letter-spacing="0.5">highbeamdigital.co.uk</text>
  <text x="1008" y="1053" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="end">04 / 08</text>

  <!-- Bottom colour bar -->
  <rect x="0" y="1068" width="720" height="12" fill="#0f766e"/>
  <rect x="720" y="1068" width="360" height="12" fill="#000998"/>
