<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#fafaf8"/>
  <rect x="1" y="1" width="1078" height="1066" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Right panel background -->
  <rect x="560" y="0" width="520" height="1080" fill="#0f172a"/>

  <!-- Eyebrow left -->
  <text x="72" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#0f766e">WHO I HELP</text>

  <!-- Left accent bar -->
  <rect x="72" y="162" width="60" height="1.5" fill="#0f766e" opacity="0.4"/>

  <!-- Industries list -->
  <circle cx="84" cy="232" r="4" fill="#0f766e"/>
  <text x="102" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#0f172a">Payments &amp; FX</text>

  <circle cx="84" cy="302" r="4" fill="#0f766e"/>
  <text x="102" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#0f172a">Embedded Finance &amp; Lending</text>

  <circle cx="84" cy="372" r="4" fill="#0f766e"/>
  <text x="102" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#0f172a">Banking Infrastructure</text>
  <text x="102" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#0f172a">&amp; RegTech</text>

  <circle cx="84" cy="462" r="4" fill="#0f766e"/>
  <text x="102" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#0f172a">Accounting &amp; TaxTech</text>

  <!-- Left bottom quote -->
  <text x="72" y="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#64748b">From payment rails to PSD3,</text>
  <text x="72" y="638" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#64748b">tokenisation to treasury —</text>
  <text x="72" y="666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#64748b">I can help you simplify without</text>
  <text x="72" y="694" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#64748b">dumbing down.</text>

  <!-- Right panel content -->
  <!-- Big stat -->
  <text x="600" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="130" fill="#0f766e" font-weight="400">10+</text>
  <text x="600" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94a3b8">years in fintech marketing</text>

  <rect x="600" y="420" width="50" height="1.5" fill="#0f766e" opacity="0.4"/>

  <text x="600" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#f8fafc">Startups to category leaders.</text>
  <text x="600" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#64748b">Backed by experience leading</text>
  <text x="600" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#64748b">fintech marketing, acquisition</text>
  <text x="600" y="574" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#64748b">and content strategy.</text>

  <!-- Footer -->
  <text x="72" y="1053" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="0.5">highbeamdigital.co.uk</text>
  <text x="1008" y="1053" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="end">03 / 08</text>

  <!-- Bottom colour bar -->
  <rect x="0" y="1068" width="720" height="12" fill="#0f766e"/>
  <rect x="720" y="1068" width="360" height="12" fill="#000998"/>
