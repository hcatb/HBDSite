<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#fafaf8"/>
  <rect x="1" y="1" width="1078" height="1066" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left teal accent bar -->
  <rect x="72" y="130" width="4" height="780" fill="#0f766e"/>

  <!-- Eyebrow -->
  <text x="96" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#0f766e">CASE STUDY</text>

  <!-- Company name -->
  <text x="96" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#0f172a">iwoca</text>

  <!-- Divider -->
  <rect x="96" y="264" width="50" height="1.5" fill="#0f766e" opacity="0.4"/>

  <!-- Big stat 1 -->
  <text x="96" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#0f766e">+40%</text>
  <text x="96" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" fill="#334155">SEO traffic increase in 6 months</text>

  <!-- Divider -->
  <rect x="96" y="490" width="936" height="1" fill="#e2e8f0"/>

  <!-- Big stat 2 -->
  <text x="96" y="600" font-family="Georgia, 'Times New Roman', serif" font-size="100" fill="#000998">£300,000</text>
  <text x="96" y="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" fill="#334155">in new loan volumes generated</text>

  <!-- Divider -->
  <rect x="96" y="688" width="936" height="1" fill="#e2e8f0"/>

  <!-- Method -->
  <text x="96" y="738" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#64748b">Content strategy, keyword research</text>
  <text x="96" y="766" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" fill="#64748b">&amp; high-quality article production</text>

  <!-- Footer -->
  <text x="72" y="1053" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="0.5">highbeamdigital.co.uk</text>
  <text x="1008" y="1053" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="end">05 / 08</text>

  <!-- Bottom colour bar -->
  <rect x="0" y="1068" width="720" height="12" fill="#0f766e"/>
  <rect x="720" y="1068" width="360" height="12" fill="#000998"/>
