  <text x="120" y="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#475569">Also available as a Fractional Content Lead — embedded in your team, owning strategy and execution end-to-end.</text>

  <!-- Footer -->
  <text x="120" y="1050" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e293b">highbeamdigital.co.uk</text>
  <text x="1800" y="1050" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#1e293b" text-anchor="end">03 / 07</text>

  <!-- Bottom colour bar -->
  <rect x="0" y="1070" width="1280" height="10" fill="#0f766e"/>
  <rect x="1280" y="1070" width="640" height="10" fill="#000998"/>
