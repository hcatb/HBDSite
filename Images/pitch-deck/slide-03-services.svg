  <text x="120" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#0f766e">01</text>
  <text x="120" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="600" fill="#f8fafc">SEO content strategy &amp; programmes</text>
  <rect x="120" y="368" width="700" height="1" fill="#1e293b"/>

  <!-- Service 02 -->
  <text x="120" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#0f766e">02</text>
  <text x="120" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="600" fill="#f8fafc">Website messaging &amp; positioning</text>
  <rect x="120" y="484" width="700" height="1" fill="#1e293b"/>

  <!-- Service 03 -->
  <text x="120" y="536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#0f766e">03</text>
  <text x="120" y="576" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="600" fill="#f8fafc">Thought leadership &amp; founder ghostwriting</text>
  <rect x="120" y="600" width="700" height="1" fill="#1e293b"/>

  <!-- RIGHT COLUMN (x=990) -->
  <!-- Service 04 -->
  <text x="990" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#0f766e">04</text>
  <text x="990" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="600" fill="#f8fafc">Sales enablement</text>
  <text x="990" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#64748b">Case studies, battlecards &amp; collateral</text>
