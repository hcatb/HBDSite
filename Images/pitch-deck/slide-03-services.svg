  <!-- Service 05 -->
  <text x="990" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#0f766e">05</text>
  <text x="990" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="600" fill="#f8fafc">Editorial team management &amp; writer hiring</text>
