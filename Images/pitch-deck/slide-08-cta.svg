  <rect x="760" y="-60" width="420" height="540" fill="#0f766e" opacity="0.08" transform="rotate(12 970 210)"/>
  <rect x="820" y="40" width="320" height="400" fill="#000998" opacity="0.15" transform="rotate(12 980 240)"/>

  <!-- Eyebrow -->
