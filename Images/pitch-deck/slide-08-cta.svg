  <rect x="72" y="162" width="60" height="1.5" fill="#0f766e" opacity="0.4"/>

  <!-- Main headline -->
  <text x="72" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="82" fill="#f8fafc">Let's start a</text>
  <text x="72" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="82" fill="#0f766e">conversation.</text>

  <!-- Divider -->
  <rect x="72" y="402" width="936" height="1" fill="#1e293b"/>

