  <text x="72" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="28" fill="#f8fafc">henry@highbeamdigital.co.uk</text>

  <rect x="72" y="534" width="936" height="1" fill="#1e293b"/>

  <text x="72" y="586" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#475569">WEBSITE</text>
  <text x="72" y="624" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="28" fill="#f8fafc">highbeamdigital.co.uk</text>

