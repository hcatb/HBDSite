  <text x="72" y="706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#475569">BOOK A CALL</text>
  <text x="72" y="744" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="28" fill="#f8fafc">15 minutes. No pitch. No obligation.</text>

