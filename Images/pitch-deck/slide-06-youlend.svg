<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#0f172a"/>

  <!-- Subtle decorative element -->
  <rect x="-80" y="600" width="350" height="500" fill="#000998" opacity="0.2" transform="rotate(-8 95 850)"/>

  <!-- Left accent bar -->
  <rect x="72" y="130" width="4" height="780" fill="#0f766e"/>

  <!-- Eyebrow -->
  <text x="96" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#0f766e">CASE STUDY</text>

  <!-- Company name -->
  <text x="96" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#f8fafc">YouLend</text>

  <!-- Divider -->
  <rect x="96" y="274" width="50" height="1.5" fill="#0f766e" opacity="0.4"/>

  <!-- Project -->
  <text x="96" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5" fill="#475569">THE PROJECT</text>
  <text x="96" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#f8fafc">First-ever Impact Report —</text>
  <text x="96" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#f8fafc">"Widening Access to Capital"</text>

  <!-- Divider -->
  <rect x="96" y="502" width="936" height="1" fill="#1e293b"/>

  <!-- Results -->
  <text x="96" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5" fill="#475569">THE RESULTS</text>

  <circle cx="108" cy="616" r="4" fill="#0f766e"/>
  <text x="128" y="622" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" fill="#f8fafc">Media coverage in Fintech Times</text>

  <circle cx="108" cy="678" r="4" fill="#0f766e"/>
  <text x="128" y="684" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" fill="#f8fafc">FStech Award for Financial Inclusion</text>

  <circle cx="108" cy="740" r="4" fill="#0f766e"/>
  <text x="128" y="746" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" fill="#f8fafc">Strengthened brand positioning</text>
  <text x="128" y="782" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" fill="#f8fafc">as a responsible lender</text>

  <!-- Footer -->
  <text x="72" y="1053" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#334155" letter-spacing="0.5">highbeamdigital.co.uk</text>
  <text x="1008" y="1053" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="end">06 / 08</text>

  <!-- Bottom colour bar -->
  <rect x="0" y="1068" width="720" height="12" fill="#0f766e"/>
  <rect x="720" y="1068" width="360" height="12" fill="#000998"/>
