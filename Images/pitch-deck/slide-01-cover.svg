<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- Background -->
  <rect width="1080" height="1080" fill="#0f172a"/>

  <!-- Decorative rectangles top-right -->
  <rect x="820" y="-100" width="380" height="480" fill="#0f766e" opacity="0.10" transform="rotate(14 1010 140)"/>
  <rect x="890" y="30" width="300" height="380" fill="#000998" opacity="0.18" transform="rotate(14 1040 220)"/>

  <!-- Left accent bar -->
  <rect x="72" y="295" width="4" height="110" fill="#0f766e"/>

  <!-- Eyebrow -->
  <text x="92" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#0f766e">HIGH BEAM DIGITAL</text>

  <!-- Headline -->
  <text x="72" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#f8fafc">Strategic</text>
  <text x="72" y="558" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#f8fafc">Messaging</text>
  <text x="72" y="656" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#0f766e">for B2B Fintech.</text>

  <!-- Divider -->
  <rect x="72" y="694" width="90" height="1.5" fill="#0f766e" opacity="0.5"/>

