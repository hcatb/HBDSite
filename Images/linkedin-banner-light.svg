  <rect x="0" y="0" width="1584" height="396" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title — top right -->
  <text x="1504" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#0f766e" text-anchor="end">HIGH BEAM DIGITAL</text>
  <text x="1504" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="400" fill="#0f172a" text-anchor="end">Fractional Content Lead · B2B Fintech &amp; Financial Services</text>
  <rect x="1084" y="126" width="420" height="1.5" fill="#0f766e" opacity="0.35"/>
  <text x="1504" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="end">highbeamdigital.co.uk</text>

  <!-- White logo strip -->
  <rect x="0" y="188" width="1584" height="160" fill="#ffffff"/>
  <rect x="0" y="188" width="1584" height="1" fill="#e2e8f0"/>
  <rect x="0" y="348" width="1584" height="1" fill="#e2e8f0"/>

  <!-- 6 logos in one row — x=230 to 1504 (1274px). Step=212. Logo w=170 h=70 centred at y=268 -->
  <!-- Col x anchors: 230, 442, 654, 866, 1078, 1290 -->

  <!-- iwoca -->
  <image href="Client%20logos/Iwoca_Logo_Wiki.svg.png"
