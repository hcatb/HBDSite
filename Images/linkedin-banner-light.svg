<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">

  <!-- Left third — dark brand colour panel (headshot sits here) -->
  <rect x="0" y="0" width="528" height="396" fill="#0f172a"/>

  <!-- Subtle teal accent shape in left panel -->
  <rect x="-60" y="220" width="340" height="340" fill="#0f766e" opacity="0.12" transform="rotate(-15 110 390)"/>
  <rect x="320" y="-80" width="280" height="280" fill="#000998" opacity="0.18" transform="rotate(-15 460 60)"/>

  <!-- Teal vertical separator -->
  <rect x="528" y="0" width="4" height="396" fill="#0f766e"/>

  <!-- Right two-thirds — white -->
  <rect x="532" y="0" width="1052" height="396" fill="#ffffff"/>

  <!-- Eyebrow -->
  <text x="564" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#0f766e">HIGH BEAM DIGITAL</text>

  <!-- Title — large serif, two lines -->
  <text x="564" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#0f172a">Fractional Content Lead</text>
  <text x="564" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" fill="#334155">B2B Fintech &amp; Financial Services</text>

  <!-- Teal accent rule -->
  <rect x="564" y="206" width="480" height="1.5" fill="#0f766e" opacity="0.4"/>

  <!-- Logo row — 6 logos, in colour, clearly smaller than title -->
  <!-- x=564 to 1504 = 940px. 6 slots × 156px. Logo w=128 h=50 -->

  <!-- iwoca -->
  <image href="Client%20logos/Iwoca_Logo_Wiki.svg.png"
    x="578" y="232" width="128" height="50"
    preserveAspectRatio="xMidYMid meet"/>

  <!-- Zencargo -->
  <image href="Client%20logos/ZC_Logo_Coloured-1.png"
    x="734" y="232" width="128" height="50"
    preserveAspectRatio="xMidYMid meet"/>

  <!-- MSCI -->
  <image href="Client%20logos/MSCI_logo_2019.svg"
    x="890" y="232" width="128" height="50"
    preserveAspectRatio="xMidYMid meet"/>

  <!-- Dext -->
  <image href="Client%20logos/dext-logo-rgb-orange.webp"
    x="1046" y="232" width="128" height="50"
    preserveAspectRatio="xMidYMid meet"/>

  <!-- SAP Fioneer -->
  <image href="Client%20logos/Fioneer%20Logo_Black%20and%20Gold_LowRes_Web_Negative.png"
    x="1202" y="232" width="128" height="50"
    preserveAspectRatio="xMidYMid meet"/>

  <!-- Nium -->
  <image href="Client%20logos/nium-logo.png"
    x="1358" y="232" width="128" height="50"
    preserveAspectRatio="xMidYMid meet"/>

  <!-- URL bottom-right -->
  <text x="1504" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="end" letter-spacing="0.5">highbeamdigital.co.uk</text>

  <!-- Bottom colour bar -->
  <rect x="0" y="386" width="1056" height="10" fill="#0f766e"/>
  <rect x="1056" y="386" width="528" height="10" fill="#000998"/>

</svg>
